<app-card-shell>

  <div class="p-5 border-b border-sky-900/80">

    <div class="flex gap-2 flex-wrap mb-2">

      <app-badge
        [text]="announcement().visibility"
        [variant]="announcement().visibility == AnnouncementVisibility.PRIVATE ? 'info' :
        announcement().visibility == AnnouncementVisibility.ALL_TEACHERS ? 'secondary' :
        announcement().visibility == AnnouncementVisibility.COURSE ? 'violet' : 'primary'">
      </app-badge>

      <app-badge
        [text]="announcement().status"
        [variant]="
        announcement().status == AnnouncementStatus.PUBLISHED ? 'success':
        announcement().status == AnnouncementStatus.DRAFT ? 'secondary' :
        announcement().status == AnnouncementStatus.ARCHIVED ? 'warning' :
        'danger'">
      </app-badge>

      @if (announcement().pinned) {
        <app-badge [text]="'PINNED'" [icon]="Pin" [variant]="'warning'"></app-badge>
      }

    </div>

    <h1 class="text-xl font-semibold text-gray-800 break-words">
      {{ announcement().title }}
    </h1>

    <div class="mt-3 text-sm text-gray-500 flex flex-wrap gap-x-5 gap-y-1">

      @if (announcement().courseId) {
        <div class="flex items-center gap-1">
          <lucide-icon [img]="BookOpen" [size]="14" class="text-sky-400"></lucide-icon>
          <p class="para-primary">{{ announcement().courseId }}</p>
        </div>
      }

      @if (announcement().batchId) {
        <div class="flex items-center gap-1">
          <lucide-icon [img]="Users" [size]="14" class="text-sky-400"></lucide-icon>
          <p class="para-primary">{{ announcement().batchId }}</p>
        </div>
      }

      <div class="flex items-center gap-1">
        <lucide-icon [img]="CalendarClock" [size]="14" class="text-sky-400"></lucide-icon>
        <p class="para-primary">Expires {{ announcement().expireAt | date:'medium' }}</p>
      </div>

    </div>

  </div>

  <div class="p-5">

    <quill-editor
      class="w-full h-auto"
      [modules]="{toolbar:false}"
      [readOnly]="true"
      [styles]="{ border: 'none'}"
      [ngModel]="announcement().description">

    </quill-editor>

  </div>

</app-card-shell>
