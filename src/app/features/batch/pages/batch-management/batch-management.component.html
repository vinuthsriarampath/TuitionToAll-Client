<app-page-layout
  [headerTitle]="'Batch Management'"
  [headerDescription]="'Manage All your Batched related the course'"
  [showBackButton]="true"
  [isLoading]="loading"
  [loaderTitle]="'Loading Batches'"
  [loaderDescription]="'Fetch all your batches from the server.'"
>
  <button data-actions (click)="openCreateBatchDialog()" class="btn-primary">
    Create Batch
  </button>

  <div data-body>
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id</th>
        <td mat-cell *matCellDef="let element"> {{ element.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="start_date">
        <th mat-header-cell *matHeaderCellDef> Start Date</th>
        <td mat-cell *matCellDef="let element"> {{ element.start_date }}</td>
      </ng-container>

      <ng-container matColumnDef="start_time">
        <th mat-header-cell *matHeaderCellDef> Start Time</th>
        <td mat-cell *matCellDef="let element"> {{ element.start_time }}</td>
      </ng-container>

      <ng-container matColumnDef="max_seat_limit">
        <th mat-header-cell *matHeaderCellDef> Seats</th>
        <td mat-cell *matCellDef="let element"> {{ element.max_seat_limit }}</td>
      </ng-container>

      <ng-container matColumnDef="batch_status">
        <th mat-header-cell *matHeaderCellDef> Batch Status</th>
        <td mat-cell *matCellDef="let element"> <span class="batch"
                                                      [ngClass]="{
                                                    'batch-primary': element.batch_status === BatchStatus.PREPARATION,
                                                    'batch-warning': element.batch_status === BatchStatus.ONGOING,
                                                    'batch-success': element.batch_status === BatchStatus.COMPLETED,
                                                    }">{{ element.batch_status }}</span></td>
      </ng-container>

      <ng-container matColumnDef="batch_enrollment_status">
        <th mat-header-cell *matHeaderCellDef> Enrollment Status</th>
        <td mat-cell *matCellDef="let element"> <span class="batch"
                                                      [ngClass]="{
                                                    'batch-success':element.enrollment_status === BatchEnrollmentStatus.OPEN,
                                                    'batch-danger':element.enrollment_status === BatchEnrollmentStatus.CLOSED
                                                    }">{{ element.enrollment_status }}</span></td>
      </ng-container>

      <ng-container matColumnDef="actions" sticky="end" class="w-24">
        <th mat-header-cell *matHeaderCellDef><span>Actions</span></th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <div class="flex gap-2">
            <a [routerLink]="[element.id]" matTooltip="View Batch" matTooltipPosition="above">
              <lucide-icon [img]="Eye" [size]="16"></lucide-icon>
            </a>
            <button (click)="openUpdateBatchDialog(element)" matTooltip="Edit Batch" matTooltipPosition="above"
                    class="cursor-pointer">
              <lucide-icon [img]="Edit" [size]="16"></lucide-icon>
            </button>
          </div>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>

      <!-- No Data Row -->
      <tr *matNoDataRow>
        <td class="mat-cell text-center p-4" [attr.colspan]="columnsToDisplay.length">
          @if (loading) {
            <ng-container>
              Loading all Batches...
            </ng-container>
          } @else {
            <ng-container>
              <app-no-content
                [title]="'No Batches Found!'"
                [description]="'You can create your first batch by clicking the Add Batch button above.'"
              ></app-no-content>
            </ng-container>
          }
        </td>
      </tr>

    </table>
    <mat-paginator
      [pageSizeOptions]="[10, 20, 50]"
      showFirstLastButtons
      aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
</app-page-layout>
