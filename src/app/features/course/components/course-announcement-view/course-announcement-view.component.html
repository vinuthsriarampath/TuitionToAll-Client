<div class="w-full overflow-x-auto">
  <app-page-title [title]="'Announcements'" [description]="`All announcements related to course ${courseId}`" [backButton]="true"></app-page-title>
  <div class="flex-1 overflow-auto">

    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let element">{{element.id}}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let element">{{element.title}}</td>
      </ng-container>
      <ng-container matColumnDef="visibility">
        <th mat-header-cell *matHeaderCellDef>Visibility</th>
        <td mat-cell *matCellDef="let element">
          <span class="batch" [ngClass]="{
            'batch-info': element.visibility == AnnouncementVisibility.PRIVATE,
            'batch-secondary': element.visibility == AnnouncementVisibility.ALL_TEACHERS,
            'batch-violet':element.visibility == AnnouncementVisibility.COURSE,
            'batch-primary':element.visibility == AnnouncementVisibility.BATCH
            }">{{ element.visibility }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <span class="batch" [ngClass]="{
            'batch-success':element.status == AnnouncementStatus.PUBLISHED,
            'batch-secondary':element.status == AnnouncementStatus.DRAFT,
            'batch-warning':element.status == AnnouncementStatus.ARCHIVED,
            'batch-danger':element.status == AnnouncementStatus.DELETED || element.status == AnnouncementStatus.EXPIRED
            }">{{ element.status }}</span></td>
      </ng-container>
      <ng-container matColumnDef="expireAt">
        <th mat-header-cell *matHeaderCellDef>Expires On</th>
        <td mat-cell *matCellDef="let element">
          @if (element.expireAt){
            {{ element.expireAt | date: 'dd MMM yyyy, hh:mm a' }}
          } @else {
            N/A
          }
        </td>
      </ng-container>
      <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef>Created Date</th>
        <td mat-cell *matCellDef="let element">{{ element.createdDate | date: 'dd MMM yyyy, hh:mm a' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex gap-2">
            <button [routerLink]="`${element.id}`" class="cursor-pointer">
              <lucide-icon [img]="Eye" [size]="16"></lucide-icon>
            </button>
          </div>
        </td>
        </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;" [class.pinned-row]="row.pinned"></tr>
    </table>
  </div>

</div>
