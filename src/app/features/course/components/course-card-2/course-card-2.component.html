<app-card-shell class="h-full">
  <div class="flex h-full flex-col">
    <!-- Thumbnail & Status Badge Header -->
    <div class="relative aspect-video w-full overflow-hidden rounded-t-2xl group">
      <img
        [ngSrc]="thumbnail() ? environment.COURSE_API + thumbnail() : 'no_image_provided.png'"
        width="1280"
        height="720"
        alt="Course thumbnail"
        class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"
      >
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
      <div class="absolute left-3 top-3">
        <ng-content select="[card-badge]"></ng-content>
      </div>
    </div>

    <!-- Details Body -->
    <div class="flex flex-1 flex-col gap-2 p-4">
      <div class="flex flex-col gap-2">
        <h3 class="line-clamp-2 text-base font-semibold leading-snug">
          {{ title() }}
        </h3>
        <p class="para-primary para-xs line-clamp-2 min-h-[2.75rem]">
          {{ description() }}
        </p>
      </div>

      <div class="flex flex-wrap gap-1.5">
        <app-badge variant="warning" [text]="level()"></app-badge>
        <app-badge variant="violet" [text]="language()"></app-badge>
        <app-badge variant="info" [text]="mode()"></app-badge>
      </div>

      <div class="flex items-center gap-1.5">
        <lucide-icon [img]="Star" class="h-4 w-4 shrink-0 fill-amber-500 text-amber-500"></lucide-icon>
        <p class="para-light">{{ averageRating() }}</p>
      </div>

      <!-- Projected Context Specific Card (Batch Info / Stats) -->
      <ng-content select="[card-content]"></ng-content>

      <!-- Projected Actions Footer -->
      <div class="mt-auto flex gap-2 pt-1">
        <ng-content select="[card-actions]"></ng-content>
      </div>
    </div>
  </div>
</app-card-shell>
