  @if (!loading()){
      @if (courses().length === 0) {
        <app-no-content [title]="'No Courses Found'" [description]="'there are no courses available at the moment.'"></app-no-content>
      } @else {
        @for (course of courses(); track course.id) {
          <app-course-card [course]="course"></app-course-card>
        }
      }
  } @else {
    <div class="flex flex-col gap-y-2 items-center justify-center">
      <mat-spinner diameter="35"></mat-spinner>
      <p class="para-xs para-primary animate-pulse">Loading...</p>
    </div>
  }
