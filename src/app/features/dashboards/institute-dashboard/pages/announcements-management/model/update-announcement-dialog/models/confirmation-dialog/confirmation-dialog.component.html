<app-dialog-layout
  [icon]="data.icon"
  [iconColour]="data.type"
  [title]="data.title"
  [description]="'Please confirm your action'"
  (cancelEvent)="onCancel()"
>
  <div data-body>
    <div class="p-5">

      <p class="text-sm text-gray-600 leading-relaxed">
        {{ data.message }}
      </p>

    </div>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-gray-200 flex justify-end gap-3">

      <button
        type="button"
        class="btn-mini-secondary"
        (click)="onCancel()">

        Cancel
      </button>

      <button
        type="button"
        [class]="data.confirmButtonClass"
        (click)="onConfirm()">

        {{ data.confirmText }}
      </button>

    </div>
  </div>
</app-dialog-layout>
