<div class="bg-white rounded-xl shadow">

  <div class="flex justify-between items-center p-4 border-b border-gray-200">
    <h3 class="font-semibold">Announcements</h3>
    <button class="btn-mini-primary" [routerLink]="'/ins/dashboard/announcements-mgt'">Manage</button>
  </div>

  <div class="max-h-96 overflow-y-auto p-4 space-y-3 bg-gray-50">

    @for (announcement of announcements; track announcement.id) {
      <div [routerLink]="`announcements/${announcement.id}`" class="full-w-card flex flex-col grid grid-cols-2"
           [ngClass]=" isPinnedAndActive(announcement.expireAt, announcement.pinned) ? 'bg-yellow-50 border-l-4 border-amber-500' : 'bg-white'">
        <div class="flex justify-between items-center gap-2 grid-cols-2">
          <p class="font-medium text-sm ">{{ announcement.title }}</p>
          @if (announcement.pinned) {
            <lucide-icon [img]="Pin" [size]="18" class="rotate-[20deg] text-amber-600"></lucide-icon>
          }
        </div>
        <p class="text-xs text-gray-500 cols-span-2">2 hours ago</p>
      </div>
    }

  </div>

  <div class="flex flex-col justify-between items-center py-2 border-t border-gray-200 font-medium">
    <a [routerLink]="'announcements'" class="text-sm text-blue-600 hover:text-blue-800 hover:underline">View More</a>
  </div>

</div>
