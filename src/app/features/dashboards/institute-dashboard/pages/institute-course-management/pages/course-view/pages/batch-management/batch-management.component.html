<app-page-title [title]="'Batch Management'" [description]="'Manage All your Batched related the course'" [backButton]="true">
  <a data-actions [routerLink]="['create']">
    <button  class="btn-primary">
      Create Batch
    </button>
  </a>
</app-page-title>
<div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" multiTemplateDataRows>

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="start_date">
      <th mat-header-cell *matHeaderCellDef> Start Date </th>
      <td mat-cell *matCellDef="let element"> {{element.start_date}} </td>
    </ng-container>

    <ng-container matColumnDef="start_time">
      <th mat-header-cell *matHeaderCellDef> Start Time </th>
      <td mat-cell *matCellDef="let element"> {{element.start_time}} </td>
    </ng-container>

    <ng-container matColumnDef="batch_status">
      <th mat-header-cell *matHeaderCellDef> Batch Status</th>
      <td mat-cell *matCellDef="let element"> <span class="px-3 py-1 rounded-full text-white text-sm font-semibold"
                                                    [ngClass]="{
                                                    'bg-gray-500': element.batch_status === BatchStatus.PREPARATION,
                                                    'bg-amber-500': element.batch_satus === BatchStatus.ONGOING,
                                                    'bg-green-500': element.batch_status === BatchStatus.COMPLETED
                                                    }" >{{element.batch_status}}</span> </td>
    </ng-container>

    <ng-container matColumnDef="batch_enrollment_status">
      <th mat-header-cell *matHeaderCellDef> Enrollment Status</th>
      <td mat-cell *matCellDef="let element"> <span class="px-3 py-1 rounded-full text-white text-sm font-semibold"
                                                    [ngClass]="{
                                                    'bg-green-500':element.enrollment_status === BatchEnrollmentStatus.OPEN,
                                                    'bg-red-500':element.enrollment_status === BatchEnrollmentStatus.CLOSED
                                                    }">{{element.enrollment_status}}</span> </td>
    </ng-container>

    <ng-container matColumnDef="actions" sticky="end" class="w-24">
      <th mat-header-cell *matHeaderCellDef><span class="sr-only">Actions</span></th>
      <td mat-cell *matCellDef="let element" class="text-center">
        <a [routerLink]="[element.id]" matTooltip="View Batch" matTooltipPosition="above">
          <lucide-icon [img]="Eye" [size]="16"></lucide-icon>
        </a>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 20, 50]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
</div>
