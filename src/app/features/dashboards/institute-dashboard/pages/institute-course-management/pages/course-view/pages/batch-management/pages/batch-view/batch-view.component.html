  <div class="bg-white rounded-xl shadow p-5 pb-1 mb-6">
    <app-page-title [title]="`${batch.name}`" [description]="'Course:'" [backButton]="true">
      <button data-actions class="btn-mini-primary font-semibold" (click)="editBatch()">Edit</button>
    </app-page-title>

      <p class="font-semibold text-gray-800">
        {{ batch.start_date | date }}
      </p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-xs text-gray-500">Start Time</p>

        {{ batch.start_time }}
      </p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <p class="text-xs text-gray-500">Seat Limit</p>
      <p class="font-semibold text-gray-800">
        {{ batch.is_seat_limited ? batch.max_seat_limit : 'No Limit Set!' }}
      </p>
    </div>
