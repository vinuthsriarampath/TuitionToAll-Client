<div class="chapter-boundry flex flex-col gap-3 p-3" cdkDropList (cdkDropListDropped)="drop($event)">

  @for (chapter of chapters; track chapter.id; let i = $index) {

    <app-card-shell cdkDrag cdkDragLockAxis="y" cdkDragBoundary=".chapter-boundry" class="group transition-all duration-200 hover:-translate-y-[1px]">

      <div class="flex items-center justify-between gap-3 p-3">

        <!-- Left -->
        <div class="flex items-center gap-3 flex-1 min-w-0">

          <!-- Drag Handle -->
          <div cdkDragHandle class="cursor-grab active:cursor-grabbing text-gray-400 hover:text-gray-600 transition">
            <lucide-icon [img]="GripVertical" [size]="18"/>
          </div>

          <!-- Order -->
          <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-70 flex items-center justify-center text-sm font-semibold shrink-0">
            {{ i + 1 }}
          </div>

          <!-- Chapter Info -->
          <div class="flex flex-col min-w-0 flex-1">

            <div class="flex items-center gap-2 flex-wrap">

              <h2 class="text-sm md:text-base font-semibold text-gray-800 truncate">
                {{ chapter.title }}
              </h2>

              <!-- Status -->
              <app-chapter-badge [status]="chapter.status"></app-chapter-badge>

            </div>

            <!-- Meta -->
            <div class="flex items-center gap-3 mt-1 text-xs text-gray-500">

              <span class="flex items-center gap-1">
                <lucide-icon [img]="BookOpen" [size]="14"/>
                Chapter {{ i + 1 }}
              </span>

              @if (chapter.createdDate) {
                <span class="hidden md:flex items-center gap-1">
                  <lucide-icon [img]="CalendarDays" [size]="14"/>
                  {{ chapter.createdDate | date:'MMM d, y' }}
                </span>
              }

            </div>

          </div>

        </div>

        <!-- Right Actions -->
        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">

          <button class="w-9 h-9 cursor-pointer rounded-lg hover:bg-blue-50 text-blue-600 transition flex items-center justify-center" matTooltip="Edit Chapter" matTooltipPosition="above">
            <lucide-icon [img]="Pencil" [size]="16"/>
          </button>

          <button class="w-9 h-9 cursor-pointer rounded-lg hover:bg-red-50 text-red-600 transition flex items-center justify-center" matTooltip="Delete Chapter" matTooltipPosition="above">
            <lucide-icon [img]="Trash2" [size]="16"/>
          </button>

        </div>

      </div>

    </app-card-shell>

  }

</div>
