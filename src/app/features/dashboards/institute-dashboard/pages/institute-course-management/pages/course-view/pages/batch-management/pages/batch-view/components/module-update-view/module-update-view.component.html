<app-dialog-layout (cancelEvent)="close()" [title]="'Update Module View'" [description]="'Update module details'" [icon]="Book" [loaderTitle]="'Updating Module'" [loaderDescription]="'Please wait while the module is being updated'">
  <div data-body>
    <app-module-danger-panel [module]="this.module" (triggerLoading)="this.triggerLoading()"/>
  </div>
</app-dialog-layout>
