<div class="h-full flex flex-col">

  <app-page-title [title]="'Teacher Vacancy Management'" [description]="'Manage all your vacancies here!'"
                  [backButton]="true"></app-page-title>

  <!-- 🔹 PAGE CONTENT -->
  <div class="flex-1 overflow-auto">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let element">{{ element.title }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <ng-container matColumnDef="requiredExperienceYears">
        <th mat-header-cell *matHeaderCellDef>Required YoE</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <div class="text-center">{{ element.requiredExperienceYears }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="closingDate">
        <th mat-header-cell *matHeaderCellDef>Closing Date</th>
        <td mat-cell *matCellDef="let element">{{ element.vacancyClosingDate | date:'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex gap-2">
            <button (click)="openSingleVacancyView(element)" matTooltip="View Vacancy" matTooltipPosition="above" class="cursor-pointer">
              <lucide-icon [img]="Eye" [size]="16"></lucide-icon>
            </a>
            <button matTooltip="Edit Vacancy" matTooltipPosition="above" class="cursor-pointer">
            </button>
              <lucide-icon [img]="Edit" [size]="16"></lucide-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns; sticky:true;"></tr>
      <tr mat-row *matRowDef=" let myRowData; columns:columns"></tr>
    </table>
  </div>

</div>
