<app-card-shell>
  <div class="p-4">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h3>Active Batches</h3>
        <p class="para-xs para-primary">Currently running intakes across all courses.</p>
      </div>
      <a class="link link-xs link-primary flex flex-row gap-1 items-center cursor-pointer">
        View All <lucide-icon [img]="ArrowRight" class="w-3 h-3"></lucide-icon>
      </a>
    </div>

    <div >
      <table mat-table [dataSource]="dataSource" >

        <!-- Batch Column -->
        <ng-container matColumnDef="batch">
          <th mat-header-cell *matHeaderCellDef >BATCH</th>
          <td mat-cell *matCellDef="let row">
            <p class="para-light">{{ row.batch }}</p>
            <p class="para-xs para-primary">{{ row.code }}</p>
          </td>
        </ng-container>

        <!-- Course Column -->
        <ng-container matColumnDef="course">
          <th mat-header-cell *matHeaderCellDef >COURSE</th>
          <td mat-cell *matCellDef="let row" >{{ row.course }}</td>
        </ng-container>

        <!-- Teacher Column -->
        <ng-container matColumnDef="teacher">
          <th mat-header-cell *matHeaderCellDef class="!text-left ">TEACHER</th>
          <td mat-cell *matCellDef="let row" class="">
            <div class="flex items-center justify-start gap-2">
              <img [ngSrc]="'profile_logo.png'" width="28" height="28" alt="Profile Logo" class="rounded-full w-7 h-7 object-cover shrink-0">
              <p class="para-light m-0">{{ row.teacher }}</p>
            </div>
          </td>
        </ng-container>

        <!-- Students Column -->
        <ng-container matColumnDef="students">
          <th mat-header-cell *matHeaderCellDef class="text-center">STUDENTS</th>
          <td mat-cell *matCellDef="let row" class="align-middle text-center">
            <div class="flex flex-col items-center gap-1">
              <p class="para-xs para-light m-0">
                {{ row.studentsCurrent }} / {{ row.studentsMax }}
              </p>
              <div class="w-32 h-1.5 bg-gray-100 rounded-full overflow-hidden ">
                <div class="h-full bg-emerald-700 rounded-full" [style.width.%]="getCapacityPercentage(row.studentsCurrent, row.studentsMax)"></div>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Start Date Column -->
        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef>START DATE</th>
          <td mat-cell *matCellDef="let row">{{ row.startDate }}</td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef >STATUS</th>
          <td mat-cell *matCellDef="let row">
            <app-badge [text]="row.status" [variant]="'success'"></app-badge>

          </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button class="cursor-pointer text-gray-400 hover:text-gray-600">
              <lucide-icon [img]="MoreVertical" class="w-4 h-4"></lucide-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">
            <app-no-content [title]="'No Active Batches!'" [description]="'There are no active batches to display.'"></app-no-content>
          </td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageIndex]="pageIndex" [pageSize]="pageSize" [length]="totalElements" showFirstLastButtons="true"></mat-paginator>
    </div>
  </div>
</app-card-shell>
