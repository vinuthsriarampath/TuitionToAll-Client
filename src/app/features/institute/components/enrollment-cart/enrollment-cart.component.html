<app-card-shell>
  <div class="p-4">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h3 class="text-base font-bold text-gray-900">Enrollment Overview</h3>
        <p class="para-xs para-primary">Student enrollment activity over time.</p>
      </div>
      <div class="flex items-center btn-mini-primary p-1 rounded-lg text-xs font-medium text-gray-600">
        <button class="px-2.5 py-1 rounded">7 Days</button>
        <button class="px-2.5 py-1 bg-sky-900 rounded shadow-sm font-semibold text-white">30 Days</button>
        <button class="px-2.5 py-1 rounded">3 Months</button>
        <button class="px-2.5 py-1 rounded">1 Year</button>
      </div>
    </div>
    <div class="h-64 relative">
      <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" [type]="lineChartType"></canvas>
    </div>
    <div class="flex justify-between items-center text-xs text-gray-500 mt-4 pt-3 border-t border-gray-100">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></span>
        <p class="para-xs para-light">New enrollments</p>
      </div>
      <p class="para-xs para-light">
        Peak month: <strong class="para-primary">October · 940 enrollments</strong> · <span class="text-emerald-400 font-semibold">+124% since May</span>
      </p>
    </div>
  </div>
</app-card-shell>
