<app-dialog-layout title="Upload Lecture Record" description="Upload lecture recordings for this chapter" [icon]="Upload" (cancelEvent)="onCancel()">
  <div data-body>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <app-input id="title" label="Recording Title" [required]="true" placeholder="Enter recording title" [control]="form.get('title')" />
      <app-input id="recordedDate" type="date" label="Recorded Date" class="p-0 border-none" [required]="true" placeholder="Enter recording date" [control]="form.get('recordedDate')" />
      <div class="flex flex-col justify-center items-center">
        <label for="video-input" class="w-full h-auto rounded-2xl flex justify-center items-center border-dashed border-2 border-blue-500 cursor-pointer overflow-hidden">

          <input type="file" id="video-input" (change)="onVideoSelect($event)" accept="video/*" hidden/>

          <!-- Preview Area -->
          <div class="w-full h-full bg-gray-200/30 flex justify-center items-center overflow-hidden">

            <!-- Video Preview -->
            <video *ngIf="videoUrl" [src]="videoUrl" controls class="w-full h-full object-cover"></video>

            <!-- Upload Placeholder -->
            <div *ngIf="!selectedFile" class="flex flex-col justify-center items-center text-center p-4">

              <svg xmlns="http://www.w3.org/2000/svg" class="w-11 mb-2 fill-gray-500" viewBox="0 0 32 32">
                <path d="M23.75 11.044a7.99 7.99 0 0 0-15.5-.009A8 8 0 0 0 9 27h3a1 1 0 0 0 0-2H9a6 6 0 0 1-.035-12 1.038 1.038 0 0 0 1.1-.854 5.991 5.991 0 0 1 11.862 0A1.08 1.08 0 0 0 23 13a6 6 0 0 1 0 12h-3a1 1 0 0 0 0 2h3a8 8 0 0 0 .75-15.956z"/>
                <path d="M20.293 19.707a1 1 0 0 0 1.414-1.414l-5-5a1 1 0 0 0-1.414 0l-5 5a1 1 0 0 0 1.414 1.414L15 16.414V29a1 1 0 0 0 2 0V16.414z"/>
              </svg>

              <p class="text-sm text-gray-600">
                Drag and drop or click here to upload a video
              </p>

            </div>

          </div>
        </label>
      </div>
      <div *ngIf="isUploading" class="flex flex-col gap-2">

        <div class="w-full bg-gray-200 rounded-full h-3">
          <div class="bg-blue-500 h-3 rounded-full transition-all duration-300" [style.width.%]="uploadProgress"></div>
        </div>

        <span class="text-sm text-gray-600">Uploading... {{ uploadProgress }}%</span>

      </div>
      <div class="flex justify-end gap-4">
        <button type="reset" (click)="onReset()" class="btn-mini-secondary">
          Reset
        </button>
        <button type="submit" class="btn-mini-primary" [disabled]="isUploading">
          {{ isUploading ? 'Uploading...' : 'Upload Recording' }}
        </button>
      </div>
    </form>
  </div>

</app-dialog-layout>
