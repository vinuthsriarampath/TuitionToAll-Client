<app-card-shell [routerLink]="isLocked() ? null : ['modules', moduleId()]" [class.cursor-not-allowed]="isLocked()" [class.cursor-pointer]="!isLocked()" class="group relative block rounded-2xl overflow-hidden transition-all duration-300 hover:shadow-lg focus-within:ring-2 focus-within:ring-primary-500">

  <div [class.opacity-75]="isLocked()" [class.grayscale-25]="isLocked()">
    <!-- Media Container -->
    <div class="relative aspect-video overflow-hidden rounded-t-2xl bg-slate-100">
      <img
        [ngSrc]="'no_image_provided.png'"
        class="w-full h-full object-cover transition-transform duration-300 ease-out group-hover:scale-105"
        width="1280"
        height="720"
        alt="Module Thumbnail" />

      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>

      <div class="absolute left-3 top-3 z-10">
        <app-module-badge [status]="moduleStatus()"></app-module-badge>
      </div>
    </div>

    <!-- Details Container -->
    <div class="p-4 flex flex-col justify-between min-h-[5rem]">
      <h3 class="font-semibold text-slate-800 text-base leading-snug line-clamp-2 group-hover:text-primary-600 transition-colors">
        {{ moduleName() }}
      </h3>
    </div>

    <!-- Locked State Overlay -->
    @if (isLocked()) {
      <div class="absolute inset-0 z-20 bg-slate-900/60 backdrop-blur-[1px] opacity-0 transition-opacity duration-200 group-hover:opacity-100 flex flex-col items-center justify-center text-white font-medium p-4 text-center">
        <lucide-icon [img]="LockKeyhole" class="h-8 w-8 mb-2 text-slate-200 animate-pulse"></lucide-icon>
        <span class="text-sm font-semibold tracking-wide">Module Locked</span>
      </div>
    }
  </div>
</app-card-shell>
