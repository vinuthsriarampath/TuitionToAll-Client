<app-card-shell>
  <app-card-header title="Module name Update" description="Update the name of the module here!">
    <button card-action class="btn-mini-primary flex items-center gap-1" (click)="openUpdateModuleDialog()">
      <lucide-icon [img]="Edit" [size]="14"></lucide-icon>
      Edit Module Name
    </button>
  </app-card-header>

  <div class="p-5 grid grid-cols-2 gap-5">
    <div class="col-span-2">
      <app-info-row label="Module Name" value="{{ module().name }}"></app-info-row>
    </div>
  </div>
</app-card-shell>
