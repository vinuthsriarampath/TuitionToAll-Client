<app-dialog-layout
  [loading]="isLoading"
  [loaderTitle]="'Updating Profile Details'"
  [title]="'Update Profile'"
  [description]="'Update your profile details'"
  [icon]="SquarePen"
  (cancelEvent)="onCancel()"
>
  <div data-body>
    <form (ngSubmit)="onSubmit()">
      <div class="w-full">
        <div class="flex flex-col gap-4 pb-4">
          <div class="flex flex-col gap-2">
            <p class="text-md text-gray-400 text-sm"><sup class="text-red-500">* </sup>Indicates required</p>
          </div>
          <div *ngIf="data.userRole === 'student' || data.userRole === 'teacher'" class="flex flex-col gap-2">
            <div class="flex flex-col gap-2">
              <label for="first-name" class="text-md text-gray-700">First name<sup class="text-red-500"> *</sup></label>
              <input type="text" id="first-name" [(ngModel)]="$any(user.details).firstName" name="first-name" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Your first name" required #firstName="ngModel" />
              <div *ngIf="firstName.invalid && firstName.touched" class="text-sm text-red-500 mb-4">First Name is required.</div>
            </div>
            <div class="flex flex-col gap-2">
              <label for="last-name" class="text-md text-gray-700">Last name<sup class="text-red-500"> *</sup></label>
              <input type="text" id="last-name" [(ngModel)]="$any(user.details).lastName" name="last-name" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Your last name" required #lastName="ngModel" />
              <div *ngIf="lastName.invalid && lastName.touched" class="text-sm text-red-500 mb-4">Last Name is required.</div>
            </div>
            <div class="flex flex-col gap-2">
              <label for="dob" class="text-md text-gray-700">Date of Birth<sup class="text-sm text-red-500"> *</sup></label>
              <input type="date" id="dob" [(ngModel)]="$any(user.details).dob" name="dob" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Your Birthday" required #dateOfBirth="ngModel" />
            </div>
            <div *ngIf="dateOfBirth.invalid && dateOfBirth.touched" class="text-sm text-red-500 mb-4">Date of Birth is required.</div>
          </div>

          <div *ngIf="data.userRole === 'institute'">
            <div class="flex flex-col gap-2">
              <label for="institute-name" class="text-md text-gray-700">Institute name<sup class="text-red-500"> *</sup></label>
              <input type="text" id="institute-name" [(ngModel)]="$any(user.details).instituteName" name="institute-name" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Your institute name" required #instituteName="ngModel" />
              <div *ngIf="instituteName.invalid && instituteName.touched" class="text-sm text-red-500 mb-4">Institute Name is required.</div>
            </div>
          </div>


          <div class="flex flex-col gap-2">
            <label for="contact-no" class="text-md text-gray-700">Contact<sup class="text-red-500"> *</sup></label>
            <input type="tel" id="contact-no" [(ngModel)]="user.contact" name="contact-no" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Your contact no" required pattern="[0-9]{10}" #contactNo="ngModel"  />
            <div *ngIf="contactNo.invalid && contactNo.touched" class="text-sm text-red-500 mb-4">
              <div *ngIf="contactNo.errors?.['required']">Contact Number is required.</div>
              <div *ngIf="contactNo.errors?.['pattern']">Please enter a valid 10-digit phone number.</div>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label for="address" class="text-md text-gray-700">Address<sup class="text-red-500"> *</sup></label>
            <textarea id="bio" [(ngModel)]="user.address" name="address" rows="2" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-500" placeholder="Your address" required #address="ngModel"></textarea>
            <div *ngIf="address.invalid && address.touched" class="text-sm text-red-500 mb-4">Address is required.</div>
          </div>
        </div>
      </div>
      <div class="w-full border-t-2 border-gray-200 flex justify-end items-center pt-4">
        <input type="submit" value="Save" class="btn-mini-primary">
      </div>
    </form>
  </div>
</app-dialog-layout>
