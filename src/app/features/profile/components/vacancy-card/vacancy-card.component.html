<app-card-shell>

  <div class="p-5 flex flex-col gap-3">

    <div class="flex justify-between items-start">

      <div>

        <h2 class="text-lg font-semibold text-gray-800">
          {{ vacancy().title }}
        </h2>

        <div class="flex gap-2 mt-1 text-xs text-gray-500">

          <app-badge
            [text]="vacancy().requiredExperienceYears + ' yrs exp'"
            variant="warning">
          </app-badge>

          <app-badge
            [text]="'Closes: ' + (vacancy().vacancyClosingDate | date:'mediumDate')"
            variant="danger">
          </app-badge>

        </div>

      </div>

      <button
        [routerLink]="[vacancy().id + '/apply']"
        class="btn-mini-primary">

        Apply

      </button>

    </div>

    <div class="text-sm text-gray-700">

      <quill-editor
        [readOnly]="true"
        [modules]="{toolbar:false}"
        class="prose w-full h-auto"
        [styles]="{ border: 'none'}"
        [ngModel]="vacancy().jobDescription">

      </quill-editor>

    </div>

  </div>

</app-card-shell>
