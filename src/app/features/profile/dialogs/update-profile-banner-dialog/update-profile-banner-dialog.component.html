<app-dialog-layout
  [loading]="isLoading"
  [loaderTitle]="'Updating Profile Banner'"
  [title]="'Update Profile Banner'"
  [description]="'Update your profile banner here!'"
  [icon]="ImageIcon"
  (cancelEvent)="onCancel()"
>
  <div data-body>
    <form (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-4 mb-4">
        <div class="flex flex-col justify-center items-center">
          <label id="image-input" class="w-full h-60 flex justify-center items-center border-dashed border-2 border-sky-500 hover:cursor-pointer">
            <input type="file" id="image-input" (change)="onImageSelect($event)" accept="image/*" hidden class="w-full p-2 border border-gray-300 focus:outline-none focus:ring focus:ring-blue-500" />
            <div id="image-view" [style]="imageUrl ? 'background-image: url(' + imageUrl + '); ' : ''" class="w-full h-full bg-sky-200/10 flex justify-center items-center bg-center bg-cover overflow-hidden">
              <div *ngIf="!selectedFile " class="flex flex-col justify-center items-center">
                <lucide-icon [img]="UploadCloud" class="w-10 h-10 text-sky-500 mb-2"></lucide-icon>
                <p class="para-xs para-primary">Drag and Drop or click here to upload an image</p>
              </div>
            </div>
          </label>
        </div>
      </div>
      <div class="flex justify-end gap-4">
        <button type="reset" (click)="onReset()"  class="btn-mini-secondary">
          Reset
        </button>
        <button type="submit" [disabled]="!selectedFile"  class="btn-mini-primary">
          {{ isLoading ? "loading" : "Update Profile Banner" }}
        </button>
      </div>
    </form>
  </div>
</app-dialog-layout>
