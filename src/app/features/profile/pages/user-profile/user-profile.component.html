<div class="flex flex-col max-w-screen">
  <div class="sticky top-0 z-50">
    <app-navbar></app-navbar>
  </div>

  <div class="min-h-screen">
    <div class="w-full max-w-screen-xl mx-auto px-2 sm:px-4 md:px-6">

      <app-profile-cover [profileUser]="profileUser" [currentUser]="currentUser" [isSameUser]="isSameUser" [loading]="loading" (profileUpdated)="updateProfileDetails($event)"></app-profile-cover>

      <div class="flex flex-col md:flex-row gap-4 p-4 items-start">
        <div class="flex flex-col gap-4 text-gray-800 w-full md:w-1/3 md:sticky md:top-16 md:z-10">
          <app-profile-intro [profileUser]="profileUser" [currentUser]="currentUser" [isSameUser]="isSameUser" [loading]="loading" (profileUpdated)="updateProfileDetails($event)"></app-profile-intro>
        </div>

        <app-card-shell class="w-full md:w-2/3">
          <div class="p-2">
            <app-profile-tabs [profileUser]="profileUser" [currentUser]="currentUser" [isSameUser]="isSameUser"></app-profile-tabs>
          </div>
        </app-card-shell>
      </div>
    </div>
  </div>
</div>
