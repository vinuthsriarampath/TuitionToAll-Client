<app-card-shell>
  <div class="p-4 flex flex-col gap-4">

    <h3>Reviews</h3>

    <!-- Existing Reviews List -->
    @if (totalElements() > 0) {
      <div class="flex flex-col gap-4">
        @for (review of reviews(); track review.id) {
          <app-review-card [review]="review"></app-review-card>
        }

        @if (totalElements() > pageSize()) {
          <div class="flex justify-center mt-4">
            <mat-paginator [length]="totalElements()" [pageSize]="pageSize()" [pageIndex]="pageIndex()"
                           [pageSizeOptions]="[5, 10, 25, 50]" (page)="onPageChange($event)">
            </mat-paginator>
          </div>
        }
      </div>
    } @else {
      <app-no-content [title]="'No Reviews Found'" [description]="'There are no reviews for this course yet.'"></app-no-content>
    }
  </div>
</app-card-shell>
