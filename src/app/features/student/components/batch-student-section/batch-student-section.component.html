<app-page-layout
  [headerTitle]="'Students'"
>
  <div data-body class="flex flex-col gap-4">
    <app-card-shell>
      <app-filter-toolbar [formGroup]="filterForm" [fields]="filterFields">
        <button
          type="button"
          (click)="toggleSortDirection()"
          class="btn btn-mini-primary flex gap-2 items-center justify-center titlecase w-full"
          matTooltip="Toggle Sort Direction"
        >
          <lucide-icon [img]="ArrowUpDown" [size]="16"></lucide-icon>
          {{ sortDirection() | titlecase }}
        </button>
        <button
          type="button"
          (click)="clearFilters()"
          class="btn btn-mini-secondary flex gap-2 items-center justify-center w-full"
          matTooltip="Clear Filters"
        >
          Clear Filters
        </button>
      </app-filter-toolbar>
    </app-card-shell>
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let element">{{ element.studentId}}</td>
      </ng-container>
      <ng-container matColumnDef="dp">
        <th mat-header-cell *matHeaderCellDef class="text-center">DP</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex items-center justify-center">
            <img [ngSrc]="element.dp ? environment.USER_PROFILE_API + element.dp : 'profile_logo.png'" [alt]="element.firstName + ' ' + element.lastName" width="32" height="32" class="h-8 w-8 rounded-full object-cover"/>
          </div>
        </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.firstName }} {{ element.lastName }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>
      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let element">{{ element.contact | phone }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
      <tr *matNoDataRow>
        <td class="mat-cell text-center p-4" [attr.colspan]="columns.length">
          @if (loading()) {
            <ng-container>
              Loading all Students...
            </ng-container>
          } @else {
            <ng-container>
              <app-no-content
                [title]="'No Students Found!'"
                [description]="'There are no students enrolled in this batch.'"
              ></app-no-content>
            </ng-container>
          }
        </td>
      </tr>
    </table>
    <mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[5, 10, 25, 50]" (page)="onPageChange($event)"></mat-paginator>
  </div>
</app-page-layout>
