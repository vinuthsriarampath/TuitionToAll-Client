<app-page-layout
  [headerTitle]="'Teacher Vacancy Management'"
  [headerDescription]="'Manage all your vacancies here!'"
  [showBackButton]="true"
>
  <div data-body>
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let element">{{ element.title }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <span class="batch" [ngClass]="{
          'batch-success':element.status == TeacherVacancyStatus.OPEN,
          'batch-warning': element.status == TeacherVacancyStatus.FILLED,
          'batch-danger': element.status == TeacherVacancyStatus.CLOSED
           }">
            {{ element.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="requiredExperienceYears">
        <th mat-header-cell *matHeaderCellDef>Required YoE</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <div class="text-center">{{ element.requiredExperienceYears }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="closingDate">
        <th mat-header-cell *matHeaderCellDef>Closing Date</th>
        <td mat-cell *matCellDef="let element">{{ element.vacancyClosingDate | date:'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex gap-2">
            <button (click)="openSingleVacancyView(element)" matTooltip="View Vacancy" matTooltipPosition="above" class="cursor-pointer">
              <lucide-icon [img]="Eye" [size]="16"></lucide-icon>
            </button>
            <button (click)="openVacancyUpdateDialog(element)" matTooltip="Edit Vacancy" matTooltipPosition="above" class="cursor-pointer">
              <lucide-icon [img]="Edit" [size]="16"></lucide-icon>
            </button>
            <a [routerLink]="[element.id+'/applications']" matTooltip="View Applications" matTooltipPosition="above" class="cursor-pointer">
              <lucide-icon [img]="FileUser" [size]="16"></lucide-icon>
            </a>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns; sticky:true;"></tr>
      <tr mat-row *matRowDef=" let myRowData; columns:columns"></tr>

      <tr *matNoDataRow>
        <td class="mat-cell text-center p-4" [attr.colspan]="columns.length">
          @if (loading) {
            <ng-container>
              Loading all Vacancies...
            </ng-container>
          } @else {
            <ng-container>
              <app-no-content
                [title]="'No Vacancies Found!'"
                [description]="'You can create your first vacancy by clicking the Add button above.'"
              ></app-no-content>
            </ng-container>
          }
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalElements"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]"
      showFirstLastButtons
      aria-label="Select page of vacancies"
      [hidden]="loading || dataSource.data.length === 0"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</app-page-layout>
