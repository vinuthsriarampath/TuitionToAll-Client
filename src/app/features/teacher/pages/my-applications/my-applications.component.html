<app-page-layout [headerTitle]="'My Applications'" [headerDescription]="'View and manage your applications'" [loaderTitle]="'Loading applications...'" [loaderDescription]="'Please wait while we fetch your applications.'" [isLoading]="loading">
  <div data-body>
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="applicationId">
        <th mat-header-cell *matHeaderCellDef>Application Id</th>
        <td mat-cell *matCellDef="let data"> {{data.applicationId}}</td>
      </ng-container>

      <ng-container matColumnDef="vacancy">
        <th mat-header-cell *matHeaderCellDef>Vacancy</th>
        <td mat-cell *matCellDef="let data"> <a class="link link-primary" [routerLink]="['/profile/',data.instituteUserSlug, data.vacancyId,'apply']">{{data.vacancyTitle}}</a></td>
      </ng-container>

      <ng-container matColumnDef="institute">
        <th mat-header-cell *matHeaderCellDef>Institute</th>
        <td mat-cell *matCellDef="let data">  <a class="link link-primary" [routerLink]="['/profile/',data.instituteUserSlug]">{{data.instituteName}}</a></td>
      </ng-container>

      <ng-container matColumnDef="applicationStatus">
        <th mat-header-cell *matHeaderCellDef>Application Status</th>
        <td mat-cell *matCellDef="let data">
          <app-badge [text]="data.applicationStatus | titlecase " [variant]=" data.applicationStatus == ApplicationStatus.PENDING ? 'warning' :
          data.applicationStatus == ApplicationStatus.CANCELED ? 'secondary' :
          data.applicationStatus == ApplicationStatus.REJECTED ? 'danger' : 'success'
          " ></app-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="appliedDate">
        <th mat-header-cell *matHeaderCellDef>Applied On</th>
        <td mat-cell *matCellDef="let data"> {{data.appliedDate | date: 'medium'}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true;"></tr>
      <tr mat-row *matRowDef="let row; columns:displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="totalItems" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange($event)"></mat-paginator>
  </div>
</app-page-layout>
