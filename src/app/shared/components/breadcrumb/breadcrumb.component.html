<nav aria-label="Breadcrumb" class="flex items-center">
  @if (breadcrumbService.breadcrumbs$ | async; as breadcrumbs) {
    <ol class="flex items-center gap-1.5 px-3 py-1.5 bg-sky-900/40 border border-sky-700/30 backdrop-blur-md rounded-full shadow-inner">
      @for (breadcrumb of breadcrumbs; track breadcrumb.url; let last = $last) {
        <li class="inline-flex items-center gap-1.5">
          <a
            [routerLink]="breadcrumb.url"
            [class.pointer-events-none]="last"
            [attr.aria-current]="last ? 'page' : null"
            class="text-xs md:text-sm font-medium tracking-wide transition-all duration-200 ease-in-out rounded-md px-1.5 py-0.5 focus:outline-none focus:ring-2 focus:ring-sky-400/50"
            [ngClass]="{
              'text-sky-50 font-semibold drop-shadow-sm': last,
              'text-sky-300/80 hover:text-white hover:bg-sky-800/50': !last
            }">
            {{ breadcrumb.label }}
          </a>

          @if (!last) {
            <!-- Chevron Separator -->
            <svg
              class="w-3.5 h-3.5 text-sky-400/50 shrink-0 select-none"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          }
        </li>
      }
    </ol>
  }
</nav>
