<!-- Header / Navbar -->
<header class="bg-sky-950/80 backdrop-blur-md border-b border-sky-800/50 shadow-lg">
  <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between">

    <div class="flex items-center justify-between w-full md:w-auto">
      <h3 class="text-sky-50 text-2xl sm:text-3xl font-bold tracking-tight drop-shadow-sm flex items-center gap-2">
        <lucide-icon [img]="GraduationCap" class="w-6 h-6 text-sky-400"></lucide-icon>
        <span>Tuition<span class="text-sky-400">ToAll</span></span>
      </h3>

      <button
        class="md:hidden text-sky-200 hover:text-white p-2 rounded-lg hover:bg-sky-900/50 focus:outline-none transition-all active:scale-95"
        (click)="toggleMenu()"
        aria-label="Toggle Navigation Menu">
        <lucide-icon [img]="menuOpen ? X : Menu" class="w-6 h-6"></lucide-icon>
      </button>
    </div>

    <nav [ngClass]="{'hidden': !menuOpen, 'md:block': true}" class="w-full md:w-auto mt-4 md:mt-0 animate-in fade-in slide-in-from-top-2 duration-200">
      <ng-content></ng-content>
    </nav>
  </div>
</header>
