<div class="max-w-full p-6 bg-sky-950/90 backdrop-blur-md border border-sky-800/50 rounded-2xl shadow-xl animate-in fade-in zoom-in-95">

  <div class="flex items-start gap-3.5 mb-4">
    <!-- Icon Container -->
    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-sky-900/60 border border-sky-700/50">
      <lucide-icon [img]="Info" class="w-5 h-5 text-sky-400"></lucide-icon>
    </div>

    <!-- Content Area -->
    <div class="flex-1 min-w-0">
      <h2 class="text-base md:text-lg font-semibold tracking-wide text-sky-50">
        {{ title }}
      </h2>
      <div class="text-sm font-medium tracking-wide text-sky-200/90 mt-1 leading-relaxed break-words" [innerHTML]="description"></div>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-sky-800/40 my-4"></div>

  <!-- Action Buttons -->
  <div class="flex justify-end gap-3">
    <button class="btn-mini-primary px-4 py-2 w-24 active:scale-95 transition-all cursor-pointer" (click)="onConfirm()">
      Close
    </button>
  </div>

</div>
