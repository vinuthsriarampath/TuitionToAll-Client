<div class="max-w-full p-6 bg-white rounded-2xl shadow-lg">

  <div class="flex items-start gap-3 mb-4">
    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-blue-100">
      <span class="text-blue-600 text-xl">!</span>
    </div>

    <div class="flex-1">
      <h2 class="text-lg font-semibold text-gray-800">
        {{ message }}
      </h2>
      <p class="text-sm text-gray-500 mt-1 leading-relaxed break-words">
        {{ description }}
      </p>
    </div>
  </div>

  <div class="border-t border-gray-200 my-4"></div>

  <div class="flex justify-end gap-3">
    <button class="btn-mini-light px-4 py-2" (click)="onCancel()">
      Cancel
    </button>

    <button class="btn-mini-primary px-4 py-2" (click)="onConfirm()">
      Confirm
    </button>
  </div>

</div>
