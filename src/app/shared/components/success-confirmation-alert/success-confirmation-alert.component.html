<div class="max-w-full p-6 bg-sky-950/80 backdrop-blur-md border border-sky-800/50 rounded-2xl shadow-lg animate-in fade-in zoom-in-95">

  <div class="flex items-start gap-3 mb-4">
    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-sky-900/60 border border-sky-700/50">
      <lucide-icon [img]="CheckCircle" class="w-5 h-5 text-emerald-400"></lucide-icon>
    </div>

    <div class="flex-1">
      <h2 class="text-base md:text-lg font-semibold tracking-wide text-sky-50 drop-shadow-sm">
        {{ message }}
      </h2>
      <p class="text-xs text-sky-200/80 mt-1 leading-relaxed break-words">
        {{ description }}
      </p>
    </div>
  </div>

  <div class="border-t border-sky-800/40 my-4"></div>

  <div class="flex justify-end gap-3">
    <button class="btn-mini-light px-4 py-2 active:scale-95 transition-all cursor-pointer" (click)="onCancel()">
      Cancel
    </button>

    <button class="btn-mini-primary px-4 py-2 active:scale-95 transition-all cursor-pointer" (click)="onConfirm()">
      Confirm
    </button>
  </div>

</div>
