<p class="form-label">
  {{ label() }}

  @if (required()) {
    <span class="text-red-500">*</span>
  }
</p>

<div class="flex flex-col gap-2" [class.border]="showContainer()" [class.rounded-lg]="showContainer()" [class.p-3]="showContainer()" [class.border-red-500]="hasError()">
  @for (opt of options(); track getValue(opt)) {
    <label class="flex items-center gap-2 cursor-pointer select-none" [for]="id() + '-' + getValue(opt)">

      <!-- MULTIPLE -->
      @if (multiple()) {
        <input type="checkbox" class="cursor-pointer" [id]="id() + '-' + getValue(opt)" [checked]="isChecked(getValue(opt))" (change)="onMultipleChange($event, getValue(opt))"/>
      }

      <!-- SINGLE -->
      @if (!multiple()) {
        <input type="checkbox" class="cursor-pointer rounded-sm" [id]="id() + '-' + getValue(opt)" [checked]="control()?.value === getValue(opt)" (change)="onSingleChange($event, getValue(opt))"/>
      }
      <span>{{ getLabel(opt) }}</span>
    </label>
  }
</div>

@if (control()?.errors?.['required'] && control()?.touched) {
  <p class="form-error">
    * {{ label() }} is Mandatory!
  </p>
}

@if (control()?.errors?.['server']) {
  <p class="form-error">
    * {{ control()?.errors?.['server'] }}
  </p>
}
