<label class="form-label" [for]="id()">
  {{ label() }}

  @if (required()) {
    <span class="text-red-500">*</span>
  }
</label>
<input #fileInput type="file"
       [id]="id()"
       (change)="onFileSelected($event)"
       [formControl]="$any(control())"
       [accept]="accept()"
       [placeholder]="placeholder()"
       class="block form-input text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 "
/>

@if (control()?.errors?.['required'] && control()?.touched) {
  <p class="form-error">
    * {{ label() }} is Mandatory!
  </p>
}

@if (control()?.errors?.['invalidFileType']) {
  <p class="form-error">
    * {{ control()?.errors?.['invalidFileType'] }}
  </p>
}

@if (control()?.errors?.['server']) {
  <p class="form-error">
    * {{ control()?.errors?.['server'] }}
  </p>
}
