<div class="relative w-full space-y-1.5">
  <!-- Label Section -->
  <label class="form-label block text-xs md:text-sm font-semibold tracking-wide text-sky-100/90" [for]="id()">
    {{ label() }}

    @if (required()) {
      <span class="ml-0.5 text-red-400 font-bold" aria-hidden="true">*</span>
    }
  </label>

  <!-- Select Input Wrapper -->
  <div class="relative flex items-center">
    <select
      class="form-input w-full appearance-none rounded-xl border border-sky-800/60 bg-sky-950/80 py-2.5 pl-3.5 pr-10 text-sm font-medium text-sky-50 shadow-inner backdrop-blur-md transition-all duration-200 hover:border-sky-700/80 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-400/20 disabled:cursor-not-allowed disabled:opacity-50"
      [id]="id()"
      [formControl]="$any(control())"
      [class.form-input-error]="control()?.invalid && control()?.touched"
    >
      <option value="" disabled selected class="bg-slate-900 text-sky-300/60">
        {{ placeholder() }}
      </option>

      @for (opt of options(); track opt) {
        <option [value]="getValue(opt)" class="bg-slate-900 text-sky-100 py-1">
          {{ getLabel(opt) }}
        </option>
      }
    </select>

    <!-- Dropdown Chevron Icon -->
    <div class="pointer-events-none absolute right-3 flex items-center text-sky-400/70">
      <lucide-icon [img]="ChevronDown" class="w-4 h-4 transition-transform duration-200"></lucide-icon>
    </div>
  </div>

  <!-- Error Messages -->
  @if (control()?.errors?.['required'] && control()?.touched) {
    <p class="form-error flex items-center gap-1 text-xs font-medium text-red-400 animate-in fade-in slide-in-from-top-2">
      <lucide-icon [img]="AlertCircle" class="w-3.5 h-3.5 shrink-0 text-red-400"></lucide-icon>
      <span>* {{ label() }} is Mandatory!</span>
    </p>
  }

  @if (control()?.errors?.['server']) {
    <p class="form-error flex items-center gap-1 text-xs font-medium text-red-400 animate-in fade-in slide-in-from-top-2">
      <lucide-icon [img]="AlertCircle" class="w-3.5 h-3.5 shrink-0 text-red-400"></lucide-icon>
      <span>* {{ control()?.errors?.['server'] }}</span>
    </p>
  }
</div>
